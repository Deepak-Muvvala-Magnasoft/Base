<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <img>
  <title>Visitor Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/visitor_form.css') }}">
</head>

<div id="modalBackdrop"></div>
<div id="submitModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="msg" id="submitModalMsg">Saved successfully</div>
  <!-- <button type="button" class="closeBtn" id="submitModalClose">Close</button> -->
</div>

<script>
(function(){
  const modal = document.getElementById('submitModal');
  const modalMsg = document.getElementById('submitModalMsg');
  const modalClose = document.getElementById('submitModalClose');
  const backdrop = document.getElementById('modalBackdrop');

  window.showModal = function(text, type='success', autoHide=true, timeout=3500) {
    modalMsg.textContent = text || '';
    modal.className = ''; // reset classes
    modal.classList.add(type);
    modal.style.display = 'block';
    backdrop.style.display = 'block';
    modal.setAttribute('aria-hidden', 'false');
    if (autoHide) {
      clearTimeout(modal._timer);
      modal._timer = setTimeout(window.hideModal, timeout);
    }
  };

  window.hideModal = function() {
    modal.style.display = 'none';
    backdrop.style.display = 'none';
    modal.setAttribute('aria-hidden', 'true');
    clearTimeout(modal._timer);
  };

  modalClose.addEventListener('click', window.hideModal);
  backdrop.addEventListener('click', window.hideModal);
})();
</script>

<body>

  {% if not visitor_only %}
<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <div class="logo">
      <a href="{{ url_for('vms') }}">
        <img src="{{ url_for('static', filename='images/Magnasoft.png') }}" alt="Company Logo">
      </a>
    </div>

    <ul class="nav-links">
      <li><a href="/" class="nav-btn-outline">Home</a></li>
      <li>
        <a href="{{ url_for('visitors_list') }}"
           class="nav-link {% if active_page=='list' %}active{% endif %}">
           Visitors List
        </a>
      </li>
      <li><a href="{{ url_for('logout') }}" class="nav-link">Logout</a></li>
    </ul>
  </div>
</nav>
{% endif %}
  <div class="container visitor-center">

    <img
      src="{{ url_for('static', filename='images/Mpass.png') }}"
      alt="Magnasoft logo"
      class="logo-height"
      loading="lazy"
      width="200" height="60"
    >
    <h2>Visitor Registration</h2>
  

   <!-- change the form tag to include enctype -->
  <form id="visitorForm" method="POST" action="{{ url_for('add_visitor') }}" enctype="multipart/form-data">

      <!-- mark this POST as coming from the public/QR visitor page -->
  <input type="hidden" name="visitor_only" value="{{ '1' if visitor_only else '' }}">

  <!-- keep these hidden so backend/email logic has the fields available even if staff selects are not shown -->
  <input type="hidden" id="contact_person" name="contact_person" value="">
  <input type="hidden" id="contact_email"  name="contact_email"  value="">
  <div class="form-grid">

    <!-- Name -->
    <div class="col-label"><label class="required">Name</label></div>
    <div class="col-field">
      <input type="text" name="name" required placeholder="Enter full name">
    </div>

    <!-- Company -->
    <div class="col-label"><label class="required">Company / Coming From</label></div>
    <div class="col-field">
      <input type="text" name="company" required placeholder="Enter company name">
    </div>

    <!-- Location -->
    <div class="col-label"><label class="required">Location</label></div>
    <div class="col-field">
      <select name="location" required>
        <option value="">Select Location</option>
        <option value="BLR">Bangalore</option>
        <option value="HYD">Hyderabad</option>
        <option value="HSN">Hassan</option>
      </select>
    </div>

    <!-- Mobile -->
    <!-- Mobile (no validation) -->
<div class="col-label"><label class="required" for="phone">Mobile</label></div>
<div class="col-field">
  <input
    type="tel"
    id="phone"
    name="phone"
    inputmode="tel"
    maxlength="13"
    placeholder="Enter mobile number"
    aria-describedby="phoneError"
  >
  <small id="phoneError" class="error" aria-live="polite"></small>
</div>

<!-- ID Proof: select + number inline -->
<div class="col-label"><label for="idType">ID Proof</label></div>
<div class="col-field">
  <div class="inline-row">
    <select id="idType" name="idType" aria-describedby="idError">
      <option value="">Select ID Type</option>
      <option value="Aadhaar">Aadhaar</option>
      <option value="PAN">PAN</option>
      <option value="DrivingLicense">Driving License</option>
      <option value="Passport">Passport</option>
    </select>
    <input type="text" id="idNumber" name="idNumber" placeholder="Enter ID Number" aria-describedby="idError">
  </div>
  <small id="idError" class="error" aria-live="polite"></small>
</div>

<!-- Photo / Selfie (mobile camera friendly) -->
<div class="col-label"><label>Photo (Selfie)</label></div>
<div class="col-field">
  <input
    type="file"
    id="photo"
    name="photo"
    accept="image/*"
    capture="environment"   
  >
  <div id="photoPreviewWrap" style="margin-top:8px;">
    <img id="photoPreview" alt="photo preview" style="max-width:160px; max-height:160px; display:none; border-radius:6px; border:1px solid #eee;">
  </div>
</div>


<!-- Email -->
<div class="col-label"><label for="email">Email</label></div>
<div class="col-field">
  <input type="email" id="email" name="email" required placeholder="Enter email address" aria-describedby="emailError">
  <small id="emailError" class="error" aria-live="polite"></small>
</div>

    <!-- Purpose -->
    <div class="col-label"><label class="required">Purpose</label></div>
    <div class="col-field">
      <select id="purpose" name="purpose" required>
        <option value="">Select Purpose of Visit</option>
        <option value="Meeting">Meeting</option>
        <option value="Interview">Interview</option>
        <option value="Delivery">Delivery</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Other">Other</option>
      </select>

      <!-- Other purpose (hidden by default) -->
      <div id="otherPurposeWrap" style="display:none; margin-top:10px;">
        <input id="otherPurpose" type="text" name="otherPurpose" placeholder="Please describe other purpose">
      </div>
    </div>

    <!-- Items Carried -->
<div class="col-label"><label class="required">Items Carried</label></div>
<div class="col-field">
  <div class="checkbox-inline">
    <label><input type="checkbox" name="items[]" value="Laptop"> Laptop</label>
    <label><input type="checkbox" name="items[]" value="Pendrive"> Pendrive</label>
    <label><input type="checkbox" name="items[]" value="Ipad"> Ipad</label>
    <label><input id="itemsOtherCheckbox" type="checkbox" name="items[]" value="Other"> Others</label>
  </div>

  <!-- Other items text (hidden by default) -->
  <div id="itemsOtherWrap" style="display:none; margin-top:10px;">
    <input id="itemsOtherText" type="text" name="otherItems" placeholder="Describe other items">
  </div>

</div>

    <!-- Contact Person (department select above contact person select) -->
<div class="col-label"><label class="required">Contact Department</label></div>
<div class="col-field">
  <div class="inline-row">
    <!-- left: department (select) -->
    <select id="dept" name="dept" required>
      <option value="">Select Department</option>
      <option value="HR">HR</option>
      <option value="IT">IT</option>
      <option value="Admin">Admin</option>
      <option value="Support">Support</option>
      <option value="Other">Other</option>
    </select>
</div>
</div>

    <!-- Notes -->
<div class="col-label"><label>Additional Notes</label></div>
  <div class="col-field">
    <textarea name="notes" rows="3" placeholder="Optional notes..."></textarea>
</div>

  </div>
   <div class="submit-wrap">
    <button type="submit" class="btn-submit">Submit</button>
  </div>
</form>
  </div>
  <script>
    function fetchUsers() {
    const dept = document.getElementById('dept').value;
    const location = document.querySelector('select[name="location"]').value;
    if (!dept || !location) return;  

    fetch(`/get_users?dept=${encodeURIComponent(dept)}&location=${encodeURIComponent(location)}`)
        .then(res => res.json())
        .then(data => {
           const contactSelect = document.getElementById('contact_person');
          if (contactSelect) {
            contactSelect.innerHTML = '<option value="">Select Contact Person</option>';
            data.forEach(user => {
                const option = document.createElement('option');
                option.value = user.username;
                option.setAttribute('data-email', user.email);
                option.textContent = user.username;
                contactSelect.appendChild(option);
            });
            if (contactEmailEl) contactEmailEl.value = '';
          }

            const contactperson = document.getElementById('contact_person');
            if (contactperson) {
              contactperson.innerHTML = '<option value="">Select Contact Person</option>';
              data.forEach(user => {
                  const option = document.createElement('option');
                  option.value = user.username;
                  option.setAttribute('data-email', user.email);
                  option.textContent = user.username;
                  contactperson.appendChild(option);
              });
              // use the cached reference if available
              if (typeof contactEmailEl !== 'undefined' && contactEmailEl) contactEmailEl.value = '';
            }
        });
}

// Trigger when dept or location changes
document.getElementById('dept').addEventListener('change', fetchUsers);
document.querySelector('select[name="location"]').addEventListener('change', fetchUsers);


// When user selects a contact person, fill hidden email (defensive)
const contactPersonEl = document.getElementById('contact_person');
const contactEmailEl  = document.getElementById('contact_email');
if (contactPersonEl) {
  contactPersonEl.addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex] || {};
    if (contactEmailEl) contactEmailEl.value = selectedOption.getAttribute('data-email') || '';
  });
}

  (function() {
    // Elements
    const purposeSelect = document.getElementById('purpose');
    const otherPurposeWrap = document.getElementById('otherPurposeWrap');
    const otherPurposeInput = document.getElementById('otherPurpose');

    const itemsOtherCheckbox = document.getElementById('itemsOtherCheckbox');
    const itemsOtherWrap = document.getElementById('itemsOtherWrap');
    const itemsOtherText = document.getElementById('itemsOtherText');

    // Show/hide helper for select (Purpose)
    function toggleOtherPurpose() {
      if (!purposeSelect) return;
      const isOther = purposeSelect.value === 'Other';
      otherPurposeWrap.style.display = isOther ? 'block' : 'none';
      if (otherPurposeInput) {
        otherPurposeInput.required = isOther;
        if (!isOther) otherPurposeInput.value = '';
      }
    }

    // Show/hide helper for items 'Others' checkbox
    function toggleItemsOther() {
      if (!itemsOtherCheckbox) return;
      const checked = itemsOtherCheckbox.checked;
      itemsOtherWrap.style.display = checked ? 'block' : 'none';
      if (itemsOtherText) {
        itemsOtherText.required = checked;
        if (!checked) itemsOtherText.value = '';
      }
    }

    // Attach listeners
    if (purposeSelect) {
      purposeSelect.addEventListener('change', toggleOtherPurpose);
      // call once on load to set correct state (handles back/forward)
      toggleOtherPurpose();
    }

    if (itemsOtherCheckbox) {
      itemsOtherCheckbox.addEventListener('change', toggleItemsOther);
      // call once on load
      toggleItemsOther();
    }

    // Optional: final validation before submit (extra safety)
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', function(e) {
        // if purpose is Other but empty, prevent submit (browser also blocks due to required)
        if (purposeSelect && purposeSelect.value === 'Other' && otherPurposeInput && !otherPurposeInput.value.trim()) {
          otherPurposeInput.reportValidity();
          e.preventDefault();
          return;
        }
        if (itemsOtherCheckbox && itemsOtherCheckbox.checked && itemsOtherText && !itemsOtherText.value.trim()) {
          itemsOtherText.reportValidity();
          e.preventDefault();
          return;
        }
      });
    }
  })();

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('visitorForm');
  if (!form) return;

  const idType = document.getElementById('idType');
  const idNumber = document.getElementById('idNumber');
  const email = document.getElementById('email');

  const idError = document.getElementById('idError');
  const emailError = document.getElementById('emailError');

  const ID_PATTERNS = {
    Aadhaar: {
      regex: /^\d{12}$/,
      placeholder: '12 digits (e.g. 123412341234)',
      title: '12 digit Aadhaar number'
    },
    PAN: {
      regex: /^[A-Z]{5}[0-9]{4}[A-Z]$/,
      placeholder: 'PAN (e.g. ABCDE1234F)',
      title: 'PAN: 5 letters, 4 digits, 1 letter'
    },
    DrivingLicense: {
      regex: /^[A-Za-z0-9\-\/\s]{6,16}$/,
      placeholder: 'Driving license (6-16 chars)',
      title: 'Driving license number (6–16 chars)'
    },
    Passport: {
      regex: /^[A-PR-WY][0-9]{7}$/,
      placeholder: 'Passport (e.g. A1234567)',
      title: 'Passport: 1 letter + 7 digits'
    }
  };

  function showError(el, msg) { if (el) el.textContent = msg || ''; }

    // helper: reset photo input + preview
  function resetPhotoPreview() {
    const photoInput = document.getElementById('photo');
    const photoPreview = document.getElementById('photoPreview');
    try {
      if (photoInput) {
        // clearing .value works for file inputs in modern browsers
        photoInput.value = '';
        // also try the FileList API fallback
        if (photoInput.files && photoInput.files.length) {
          photoInput.files = null;
        }
      }
    } catch (e) {
      // ignore read-only failures
      console.warn("Could not clear photo input value:", e);
    }
    if (photoPreview) {
      photoPreview.src = '';
      photoPreview.style.display = 'none';
    }
  }

  // ensure resetPhotoPreview runs on native form reset event too
  if (form) {
    form.addEventListener('reset', resetPhotoPreview);
  }


  function sanitizeForType(raw, type) {
    if (!raw) return '';
    let s = raw.trim();
    if (type === 'Aadhaar') s = s.replace(/[\s-]/g, '');
    if (type === 'PAN' || type === 'Passport') s = s.toUpperCase().replace(/\s/g, '');
    return s;
  }

  function markValid(el) {
    el.classList.remove('invalid');
    el.classList.add('valid');
  }
  function markInvalid(el) {
    el.classList.remove('valid');
    el.classList.add('invalid');
  }
  function clearMarks(el) {
    el.classList.remove('valid', 'invalid');
  }

  function updateIdValidation() {
    const val = idType.value;
    if (ID_PATTERNS[val]) {
      idNumber.required = true;
      idNumber.placeholder = ID_PATTERNS[val].placeholder;
      idNumber.title = ID_PATTERNS[val].title;
      // set HTML pattern too (optional)
      idNumber.setAttribute('pattern', ID_PATTERNS[val].regex.source);
    } else {
      idNumber.required = false;
      idNumber.removeAttribute('pattern');
      idNumber.placeholder = 'Enter ID Number';
      idNumber.title = '';
      showError(idError, '');
      clearMarks(idNumber);
    }
    // Always clear custom validity initially
    idNumber.setCustomValidity('');
  }

  // ID number live validation (sanitizes and tests with regex)
  idNumber.addEventListener('input', () => {
    const type = idType.value;
    const raw = idNumber.value;
    const sanitized = sanitizeForType(raw, type);

    // update the visible value for PAN/passport/Aadhaar (helps users)
    if (type === 'PAN' || type === 'Passport' || type === 'Aadhaar') {
      if (idNumber.value !== sanitized) idNumber.value = sanitized;
    }

    if (ID_PATTERNS[type]) {
      const ok = ID_PATTERNS[type].regex.test(sanitized);
      if (ok) {
        showError(idError, '');
        idNumber.setCustomValidity('');       // ✅ clear browser invalid state
        markValid(idNumber);
      } else {
        showError(idError, 'ID number does not match expected format for selected ID type.');
        // set a friendly custom validity message (so browser treats it invalid)
        idNumber.setCustomValidity('ID number invalid for selected type');
        markInvalid(idNumber);
      }
    } else {
      showError(idError, '');
      idNumber.setCustomValidity('');
      clearMarks(idNumber);
    }
  });

  // Email live validation
  // Email live validation
email.addEventListener('input', () => {
  const value = email.value.trim();
  email.value = value; // remove accidental spaces

  if (value === "") {
    showError(emailError, 'Email is required.');
    email.setCustomValidity('Email is required.');
    email.classList.add('invalid');
    email.classList.remove('valid');
    return;
  }

  // simple regex for email check (more reliable than only checkValidity)
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (emailRegex.test(value)) {
    showError(emailError, '');
    email.setCustomValidity('');   // ✅ clears stuck invalid state
    email.classList.add('valid');
    email.classList.remove('invalid');
  } else {
    showError(emailError, 'Enter a valid email address.');
    email.setCustomValidity('Enter a valid email address.'); // mark invalid
    email.classList.add('invalid');
    email.classList.remove('valid');
  }
});

  // Final form submission check
  // Final form submission check -> AJAX submit + popup
form.addEventListener('submit', async (ev) => {
  ev.preventDefault();              
  updateIdValidation();                
  idNumber.dispatchEvent(new Event('input'));
  email.dispatchEvent(new Event('input'));

  // stop if invalid
  if (!form.checkValidity()) {
    const firstInvalid = form.querySelector(':invalid');
    if (firstInvalid) firstInvalid.focus();
    return;
  }

  const submitBtn = form.querySelector('button[type="submit"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting...'; }

  try {
    const resp = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json'
      },
      credentials: 'same-origin'
    });

    let data = null;
    try { data = await resp.json(); } catch (e) { /* invalid JSON */ }

    if (resp.ok && data && data.success) {
      // success popup and reset form (optional)
      if (window.showModal) window.showModal(data.message || 'Saved successfully', 'success', true, 3000);

      // reset the form fields
      form.reset();

      // explicitly clear photo input + preview so next visitor can add a new photo
      resetPhotoPreview();

      // also clear any dynamic UI that depends on state (optional)
      // hide items-other text if present
      const itemsOtherWrap = document.getElementById('itemsOtherWrap');
      const itemsOtherCheckbox = document.getElementById('itemsOtherCheckbox');
      const itemsOtherText = document.getElementById('itemsOtherText');
      if (itemsOtherWrap && itemsOtherCheckbox && itemsOtherText) {
        itemsOtherWrap.style.display = itemsOtherCheckbox.checked ? 'block' : 'none';
        if (!itemsOtherCheckbox.checked) itemsOtherText.value = '';
      }
    } else {
      const msg = (data && data.message) ? data.message : (resp.statusText || 'Save failed');
      if (window.showModal) window.showModal(msg, 'error', true, 5000);
    }
  } catch (err) {
    console.error(err);
    if (window.showModal) window.showModal('Network / server error. Try again.', 'error', true, 5000);
  } finally {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit'; }
  }
});

  // init
  updateIdValidation();
});

document.getElementById('photo')?.addEventListener('change', function(e){
  const f = this.files && this.files[0];
  const img = document.getElementById('photoPreview');
  if (!f) {
    img.style.display = 'none';
    img.src = '';
    return;
  }
  const url = URL.createObjectURL(f);
  img.src = url;
  img.style.display = 'block';
  // release the object URL when image loads
  img.onload = () => { URL.revokeObjectURL(url); };
});
</script>
</script>

</body>
</html>
